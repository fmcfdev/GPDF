<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Primário -->
    <title>Juntar PDF Grátis e Online — GPDFTools</title>
    <meta
      name="description"
      content="Una múltiplos arquivos PDF em um único documento de forma gratuita, rápida e segura. Sem envio para servidores — o processamento é feito 100% no seu navegador."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gpdftools.com/pdf-merge.html" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gpdftools.com/pdf-merge.html" />
    <meta property="og:title" content="Juntar PDF Grátis — GPDFTools" />
    <meta
      property="og:description"
      content="Combine centenas de PDFs em um único arquivo. Processamento 100% local, sem upload, sem riscos."
    />
    <meta property="og:image" content="https://gpdftools.com/assets/img/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Juntar PDF Grátis — GPDFTools" />
    <meta
      name="twitter:description"
      content="Una arquivos PDF sem enviar nada para a internet. Grátis e seguro."
    />
    <meta name="twitter:image" content="https://gpdftools.com/assets/img/og-preview.png" />

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Juntar PDF — GPDFTools",
        "url": "https://gpdftools.com/pdf-merge.html",
        "description": "Una múltiplos arquivos PDF em um único documento de forma gratuita, rápida e segura. Processamento 100% local no navegador.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "inLanguage": "pt-BR",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        }
      }
    </script>

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <div id="nav-placeholder"></div>

    <div class="page-container">


      <div id="loaderOverlay" class="overlay">
        <div class="loader-content">
          <h3>Processando PDFs...</h3>
          <div class="progress-wrapper">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <p id="progressText">0%</p>
        </div>
      </div>

      <h1>Quais arquivos você deseja juntar em um único PDF?</h1>

      <div class="container" id="dropZone">
        <p class="selector">
          <span style="text-decoration: underline">Clique aqui</span> ou arraste
          para selecionar os arquivos
        </p>

        <input
          type="file"
          id="fileInput"
          multiple
          accept="application/pdf"
          style="display: none"
        />

        <div
          class="filter-container"
          id="filterContainer"
          style="display: none"
        >
          <input
            type="text"
            id="filterInput"
            placeholder="Filtrar na lista..."
          />
          <button id="clearFilterBtn" title="Limpar Filtro">×</button>
        </div>

        <div id="fileList"></div>

        <div class="actions">
          <button id="mergeBtn" disabled>Juntar e Baixar PDF</button>
          <button id="clearAllBtn" class="btn-clear" style="display: none">
            Limpar Tudo
          </button>
        </div>
        <div id="statusUpdate"></div>
      </div>


    </div>

    <script src="./assets/js/lib/pdf-lib.min.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/nav.js"></script>
  </body>
</html>
