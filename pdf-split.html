<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Primário -->
    <title>Dividir PDF Grátis e Online — GPDFTools</title>
    <meta
      name="description"
      content="Extraia páginas específicas de um PDF e gere um novo documento gratuitamente. Selecione exatamente as páginas que deseja — processamento 100% local, sem upload."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gpdftools.com/pdf-split.html" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gpdftools.com/pdf-split.html" />
    <meta property="og:title" content="Dividir PDF Grátis — GPDFTools" />
    <meta
      property="og:description"
      content="Selecione as páginas que deseja extrair e gere um novo PDF em segundos. 100% local, sem envio de arquivos."
    />
    <meta property="og:image" content="https://gpdftools.com/assets/img/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dividir PDF Grátis — GPDFTools" />
    <meta
      name="twitter:description"
      content="Extraia páginas de PDFs sem enviar nada para a internet. Grátis e seguro."
    />
    <meta name="twitter:image" content="https://gpdftools.com/assets/img/og-preview.png" />

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Dividir PDF — GPDFTools",
        "url": "https://gpdftools.com/pdf-split.html",
        "description": "Extraia páginas específicas de um PDF e gere um novo documento gratuitamente. Processamento 100% local no navegador.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "inLanguage": "pt-BR",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        }
      }
    </script>

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <div id="nav-placeholder"></div>

    <div class="page-container">
      <div class="trust-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
        Processamento 100% local — seus arquivos nunca saem do seu dispositivo
      </div>

      <div id="loaderOverlay" class="overlay">
        <div class="loader-content">
          <h3>Gerando PDF...</h3>
          <div class="progress-wrapper">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <p id="progressText">0%</p>
        </div>
      </div>

      <h1>Qual arquivo você deseja dividir?</h1>

      <!-- Etapa 1: Upload -->
      <div class="container" id="dropZone">
        <p class="selector">
          <span style="text-decoration: underline">Clique aqui</span> ou arraste
          para selecionar um arquivo PDF
        </p>
        <input
          type="file"
          id="fileInput"
          accept="application/pdf"
          style="display: none"
        />
      </div>

      <!-- Etapa 2: Seleção de Páginas (oculta até upload) -->
      <div id="splitPanel" style="display: none">
        <div class="split-info">
          <div class="split-info-text">
            <p id="fileNameDisplay"></p>
            <p id="pageCountDisplay"></p>
          </div>
          <button id="resetBtn" class="btn-secondary btn-reset">
            ↩ Trocar Arquivo
          </button>
        </div>

        <div class="split-toolbar">
          <div class="range-input-group">
            <label for="rangeInput">Intervalo de páginas:</label>
            <input type="text" id="rangeInput" placeholder="ex: 1-3, 5, 8-10" />
            <button id="applyRangeBtn" class="btn-secondary">Aplicar</button>
          </div>
          <div class="selection-actions">
            <!-- <button id="selectAllBtn" class="btn-secondary">Selecionar Tudo</button> -->
            <button id="invertSelBtn" class="btn-secondary">
              Inverter Seleção
            </button>
            <button id="clearSelBtn" class="btn-secondary">
              Limpar Seleção
            </button>
          </div>
        </div>

        <div id="pagesGrid" class="pages-grid"></div>

        <div id="selectionStatus" class="selection-status"></div>

        <div class="actions">
          <button id="extractBtn" disabled>Extrair e Baixar PDF</button>
        </div>
      </div>

      <div id="statusUpdate"></div>

      <footer>
        <p>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#86efac" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Processamento 100% local &mdash; seus arquivos nunca saem do seu dispositivo.
        </p>
      </footer>
    </div>

    <script src="./assets/js/lib/pdf-lib.min.js"></script>
    <script src="./assets/js/split.js"></script>
    <script src="./assets/js/nav.js"></script>
  </body>
</html>
